name: Temporary migration replay

on:
  push:
    branches:
      - test/migration-replay-20261008

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start --runtime native --exclude studio,mail,analytics,pooler,storage,functions
      - name: Reset database from checked-in migrations
        run: supabase db reset
      - name: Verify schema and end-to-end host flow
        shell: bash
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" <<'SQL'
          \set ON_ERROR_STOP on

          do $$
          declare
            v_count integer;
          begin
            if not exists (select 1 from pg_extension where extname = 'pgcrypto') then
              raise exception 'pgcrypto extension is missing';
            end if;

            select count(*) into v_count
            from pg_policies
            where schemaname = 'public'
              and tablename = 'live_sessions';
            if v_count <> 1 then
              raise exception 'live_sessions policy count is %, expected 1', v_count;
            end if;

            if not exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'live_sessions'
                and policyname = 'PickleStack live exact-code read'
                and cmd = 'SELECT'
            ) then
              raise exception 'exact-code SELECT policy missing';
            end if;

            if not exists (
              select 1
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public'
                and c.relname = 'live_sessions'
                and c.relrowsecurity
            ) then
              raise exception 'live_sessions RLS is not enabled';
            end if;

            if (select count(*) from public.live_sessions) <> 0 then
              raise exception 'baseline contains seeded live_sessions rows';
            end if;
          end
          $$;

          do $$
          declare
            missing text[] := '{}';
          begin
            if not exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='publish_pickle_session') then
              missing := missing || 'publish_pickle_session';
            end if;
            if not exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='rotate_pickle_host_key') then
              missing := missing || 'rotate_pickle_host_key';
            end if;
            if not exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='live_sessions_broadcast') then
              missing := missing || 'live_sessions_broadcast';
            end if;
            if cardinality(missing) > 0 then
              raise exception 'missing functions: %', missing;
            end if;
          end
          $$;

          do $$
          begin
            if not exists (
              select 1
              from pg_trigger t
              join pg_class c on c.oid=t.tgrelid
              join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public'
                and c.relname='live_sessions'
                and t.tgname='live_sessions_broadcast_trigger'
            ) then
              raise exception 'broadcast trigger missing';
            end if;

            if not exists (
              select 1
              from pg_policies
              where schemaname='realtime'
                and tablename='messages'
                and policyname='live view receive session broadcasts'
                and cmd='SELECT'
            ) then
              raise exception 'realtime receive policy missing';
            end if;
          end
          $$;

          set role anon;
          set request.headers = '{"x-picklestack-session-code":"RPLY2026"}';

          select public.publish_pickle_session(
            'RPLY2026',
            repeat('a', 64),
            '{"ping":"pong"}'::jsonb
          );

          do $$
          declare
            v_data jsonb;
          begin
            select data into v_data
            from public.live_sessions
            where code='RPLY2026';

            if v_data->>'ping' <> 'pong' then
              raise exception 'exact-code read returned wrong payload';
            end if;

            if (select count(*) from public.live_sessions) <> 1 then
              raise exception 'exact-code RLS did not return exactly one session';
            end if;
          end
          $$;

          select public.rotate_pickle_host_key(
            'RPLY2026',
            repeat('a', 64),
            repeat('b', 64)
          );

          select public.rotate_pickle_host_key(
            'RPLY2026',
            repeat('b', 64),
            repeat('c', 64)
          );

          reset role;

          do $$
          begin
            if not exists (
              select 1
              from public.live_sessions
              where code='RPLY2026'
                and host_key = encode(extensions.digest(repeat('c', 64), 'sha256'), 'hex')
            ) then
              raise exception 'host key rotation did not persist the new hash';
            end if;
          end
          $$;
          SQL
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
