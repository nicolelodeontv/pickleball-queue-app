name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-cleanup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify exact remaining branch set
        shell: bash
        run: |
          set -euo pipefail
          cleanup_branch="tmp/branch-cleanup-trigger-20261008"
          held=(
            "main"
            "db-baseline-20261008"
            "vercel/install-vercel-web-analytics-i-dibup6"
          )

          mapfile -t actual < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}' | sort)

          test "${#actual[@]}" -eq 4
          printf '%s
' "${actual[@]}" | grep -Fx -- "$cleanup_branch" >/dev/null

          for b in "${held[@]}"; do
            printf '%s
' "${actual[@]}" | grep -Fx -- "$b" >/dev/null
          done

          expected="$(printf '%s
' "${held[@]}" "$cleanup_branch" | sort)"
          actual_text="$(printf '%s
' "${actual[@]}")"
          test "$actual_text" = "$expected"

          echo "Exact 4-head preflight passed."

      - name: Delete temporary trigger branch
        shell: bash
        run: |
          set -euo pipefail
          cleanup_branch="tmp/branch-cleanup-trigger-20261008"
          echo "Deleting $cleanup_branch"
          git push origin --delete "$cleanup_branch"

      - name: Verify final survivors
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}' | sort)
          expected=$'db-baseline-20261008
main
vercel/install-vercel-web-analytics-i-dibup6'
          actual_text="$(printf '%s
' "${actual[@]}")"
          test "$actual_text" = "$expected"
          echo "Final remote head set is exactly:"
          printf '%s
' "${actual[@]}"
