name: Temp private Live View transport test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  realtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run private Broadcast transport test
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save @supabase/supabase-js@2.45.4 >/dev/null 2>&1
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { createClient } = require('@supabase/supabase-js');

          const url = 'https://wochetemsnrysnjrgoed.supabase.co';
          const html = fs.readFileSync('index.html','utf8');
          const key = html.match(/sb_publishable_[A-Za-z0-9_-]+/)[0];

          const host = createClient(url, key, { auth:{persistSession:false,autoRefreshToken:false} });
          const viewer = createClient(url, key, { auth:{persistSession:false,autoRefreshToken:false} });

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const key64 = () => crypto.randomBytes(32).toString('hex');
          const code = 'TST' + crypto.randomBytes(4).toString('hex').slice(0,7).toUpperCase();
          const initial = { t:11, courts:[], nx:[], q:['Alpha','Bravo','Charlie','Delta'], lb:[] };
          const updated = { t:11, courts:[{n:'Court 1',a:true,p:['Alpha','Bravo','Charlie','Delta'],s:[1,0]}], nx:[], q:[], lb:[] };
          const fake = { t:11, courts:[{n:'Court 1',a:true,p:['Alpha','Bravo','Charlie','Delta'],s:[9,9]}], nx:[], q:[], lb:[] };
          const k1 = key64();
          const k2 = key64();

          const rpc = (client, fn, params) => client.rpc(fn, params);

          (async()=>{
            console.log('TEST_CODE='+code);
            const p0 = await rpc(host,'publish_pickle_session',{p_code:code,p_host_key:k1,p_payload:initial});
            if(p0.error) throw new Error('initialPublish: '+p0.error.message);

            let received = null;
            let receivedFake = false;
            const ch = viewer.channel('session:'+code,{config:{private:true}});
            ch.on('broadcast',{event:'session_update'},msg=>{
              const p = msg.payload || {};
              if(p.data && p.data.courts && p.data.courts[0] && Array.isArray(p.data.courts[0].s)){
                const s = p.data.courts[0].s;
                if(s[0]===1 && s[1]===0) received = p;
                if(s[0]===9 && s[1]===9) receivedFake = true;
              }
            });
            let subStatus = null, subError = null;
            await new Promise(resolve=>{
              ch.subscribe((status,err)=>{
                subStatus=status; subError=err || null;
                if(status==='SUBSCRIBED' || status==='CHANNEL_ERROR' || status==='TIMED_OUT') resolve();
              });
            });
            if(subStatus!=='SUBSCRIBED') throw new Error('viewerSubscribed failed: '+subStatus+' '+JSON.stringify(subError));

            const rot = await rpc(host,'rotate_pickle_host_key',{p_code:code,p_old_key:k1,p_new_key:k2});
            if(rot.error) throw new Error('rotation: '+rot.error.message);

            const p1 = await rpc(host,'publish_pickle_session',{p_code:code,p_host_key:k2,p_payload:updated});
            if(p1.error) throw new Error('newHostPublish: '+p1.error.message);

            const until = Date.now()+7000;
            while(!received && Date.now()<until) await sleep(100);
            if(!received) throw new Error('viewerReceivedNewHostUpdate failed');

            const old = await rpc(host,'publish_pickle_session',{p_code:code,p_host_key:k1,p_payload:fake});
            if(!old.error || !/Invalid host key|expired session/i.test(old.error.message||'')) {
              throw new Error('oldHostRejected failed: '+JSON.stringify(old));
            }

            const replay = await rpc(host,'rotate_pickle_host_key',{p_code:code,p_old_key:k1,p_new_key:key64()});
            if(!replay.error) throw new Error('replayFails failed');

            const sendResult = await ch.send({
              type:'broadcast',
              event:'session_update',
              payload:{data:fake}
            });
            console.log('FORGED_SEND_RESULT='+String(sendResult));
            if(sendResult==='ok') throw new Error('forged send was accepted');

            await sleep(1500);
            if(receivedFake) throw new Error('forged payload reached viewer');

            console.log(JSON.stringify({
              initialPublish:true,
              viewerSubscribed:true,
              rotation:true,
              newHostPublish:true,
              viewerReceivedNewHostUpdate:true,
              oldHostRejected:true,
              replayFails:true,
              forgedViewerSendRejected:true,
              forgedPayloadNotReceived:true,
              broadcastScore:received.data.courts[0].s,
              passed:true
            }));
            await ch.unsubscribe();
            process.exit(0);
          })().catch(e=>{ console.error(e.stack||e); process.exit(1); });
          NODE
