name: Release 2 real-device checks (BrowserStack)

on:
  # This workflow is branch-only until Release 2 lands. To opt into a cloud-device run,
  # create a test-only commit whose message contains [run-real-device]. That marker is the deliberate opt-in to potentially billable BrowserStack sessions.
  push:
    branches: [release2-results-viewer-20261008]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-mobile:
    # Avoid accidental BrowserStack usage/cost on routine PR commits.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-real-device]') || contains(github.event.head_commit.message, '[device-preflight]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check test syntax
        run: node --check tests/browserstack-release1.mjs
      - name: Verify isolated test deployment target
        shell: bash
        env:
          APP_URL: ${{ secrets.QUEUEZEROTWO_TEST_APP_URL }}
          TEST_SUPABASE_URL: https://yeytqiyhosoyuassjcef.supabase.co
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const appUrl = process.env.APP_URL;
          const testUrl = process.env.TEST_SUPABASE_URL;
          assert.ok(appUrl, 'Set QUEUEZEROTWO_TEST_APP_URL to the SSO-bypass link for the test Preview deployment.');
          const app = new URL(appUrl);
          assert.ok(app.hostname.endsWith('.vercel.app'), 'BrowserStack must open a Vercel Preview deployment.');
          assert.notEqual(app.hostname, 'queuezerotwo.vercel.app', 'Production URL is forbidden for device checks.');
          assert.equal(testUrl, 'https://yeytqiyhosoyuassjcef.supabase.co', 'Only the dedicated QueueZeroTwo test project is allowed.');
          assert.notEqual(testUrl, 'https://wochetemsnrysnjrgoed.supabase.co', 'Production Supabase is forbidden for device checks.');
          console.log('Target guard passed: Vercel Preview URL + dedicated test Supabase project.');
          NODE
      - name: Check BrowserStack credentials
        id: credentials
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          missing=()
          if [[ -z "$BROWSERSTACK_USERNAME" ]]; then missing+=("BROWSERSTACK_USERNAME"); fi
          if [[ -z "$BROWSERSTACK_ACCESS_KEY" ]]; then missing+=("BROWSERSTACK_ACCESS_KEY"); fi
          if (( ${#missing[@]} == 0 )); then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "missing_secrets=" >> "$GITHUB_OUTPUT"
            echo "BrowserStack credentials are present."
          else
            missing_csv=$(IFS=,; echo "${missing[*]}")
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing_secrets=$missing_csv" >> "$GITHUB_OUTPUT"
            if [[ "$EVENT_NAME" == "workflow_dispatch" || "$HEAD_COMMIT_MESSAGE" == *"[run-real-device]"* ]]; then
              echo "::error title=Real-device gate blocked::Missing repository Actions secrets: $missing_csv. No secret values were printed."
              exit 1
            fi
            echo "::notice title=No-cost preflight only::Preview target passed. Missing BrowserStack secret(s): $missing_csv. No device session will start."
            echo "Missing BrowserStack secret(s): $missing_csv" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report no-cost preflight result
        if: ${{ github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[device-preflight]') }}
        env:
          BROWSERSTACK_CONFIGURED: ${{ steps.credentials.outputs.configured }}
          MISSING_SECRETS: ${{ steps.credentials.outputs.missing_secrets }}
        run: |
          echo "Protected Preview URL guard passed and points at the dedicated test Supabase project." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BROWSERSTACK_CONFIGURED" == "true" ]]; then
            echo "BrowserStack credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BrowserStack run is blocked until these repository secrets are added: $MISSING_SECRETS." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "No BrowserStack device session was started. This is not a physical-device pass." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Playwright client
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-real-device]') }}
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Run Release 2 scenarios on real iPhone Safari and Android Chrome
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-real-device]') }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          APP_URL: ${{ secrets.QUEUEZEROTWO_TEST_APP_URL }}
          TEST_SUPABASE_URL: https://yeytqiyhosoyuassjcef.supabase.co
        run: node tests/browserstack-release1.mjs
