name: Release 2 Playwright
# Release 2b regression v13

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:css
      - name: Check inline app JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path("index.html").read_text(encoding="utf-8")
          start = h.find("<script>\nconst K=")
          end = h.find("</script>", start)
          if start < 0 or end < 0:
            raise SystemExit("main inline script not found")
          Path("/tmp/queuezerotwo-inline.js").write_text(h[start+8:end], encoding="utf-8")
          PY
          node --check /tmp/queuezerotwo-inline.js
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: nohup python3 -m http.server 4173 >/tmp/queuezerotwo-http.log 2>&1 &
      - name: Run Release 2 Playwright smoke
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/release2b-sessions.mjs

  cleanup-retired-branches:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[branch-cleanup-final-7]')
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify exact remaining branch set
        shell: bash
        run: |
          set -euo pipefail
          cleanup_branch="tmp/branch-cleanup-trigger-20261008"
          held=(
            "main"
            "db-baseline-20261008"
            "vercel/install-vercel-web-analytics-i-dibup6"
          )

          mapfile -t actual < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}' | sort)
          test "${#actual[@]}" -eq 4
          printf '%s
' "${actual[@]}" | grep -Fx -- "$cleanup_branch" >/dev/null
          for b in "${held[@]}"; do
            printf '%s
' "${actual[@]}" | grep -Fx -- "$b" >/dev/null
          done
          expected="$(printf '%s
' "${held[@]}" "$cleanup_branch" | sort)"
          actual_text="$(printf '%s
' "${actual[@]}")"
          test "$actual_text" = "$expected"
          echo "Exact 4-head cleanup preflight passed."

      - name: Delete temporary trigger branch via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const ref = "heads/tmp/branch-cleanup-trigger-20261008";
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 41,
                body: "Final branch cleanup deleteRef succeeded for " + ref + "."
              });
            } catch (error) {
              const status = error.status ?? "unknown";
              const message = error.message ?? String(error);
              const data = error.response?.data ? JSON.stringify(error.response.data, null, 2) : "";
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 41,
                body: "Final branch cleanup deleteRef FAILED. HTTP status: " + status + "\n\n```text\n" + message + "\n" + data.slice(0, 5000) + "\n```"
              });
              throw error;
            }

      - name: Verify final survivors
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}' | sort)
          expected=$'db-baseline-20261008\nmain\nvercel/install-vercel-web-analytics-i-dibup6'
          actual_text="$(printf '%s
' "${actual[@]}")"
          test "$actual_text" = "$expected"
          echo "Cleanup complete. Final remote head set is exactly:"
          printf '%s
' "${actual[@]}"

# Final explicit-token cleanup retrigger.
