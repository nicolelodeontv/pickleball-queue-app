name: Temp Release 2b CSS build

on:
  push:
    branches: [release2b-sessions]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:css
      - name: Commit generated CSS
        run: |
          if git diff --quiet -- tailwind.css; then
            echo "tailwind.css already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailwind.css
          git commit -m "Build Tailwind CSS for release 2b"
          git push
