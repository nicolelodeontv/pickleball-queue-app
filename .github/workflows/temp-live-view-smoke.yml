name: Temporary Live View browser smoke

on:
  push:
    branches:
      - feature/live-view-qr
  pull_request:
    branches:
      - main

jobs:
  live-view-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Live View smoke test
        env:
          PICKLESTACK_PREVIEW: https://pickleball-queue-nmng4l8am-meow-7e9e.vercel.app/?_vercel_share=Hpjsm5vsGhoXbJF8TvD59O1W7GQS4T8y
        run: node .github/live-view-smoke.mjs

# Browser smoke is temporary and preview-only.
