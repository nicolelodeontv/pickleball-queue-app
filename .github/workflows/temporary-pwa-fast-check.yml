name: temporary-pwa-fast-check

on:
  push:
    branches:
      - feature/live-view-qr

jobs:
  pwa-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run mobile PWA browser check
        run: |
          npm init -y
          npm install --no-save playwright-core@latest
          node <<'NODE'
          const { chromium, devices } = require('playwright-core');
          const fs = require('fs');

          const candidates = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium', '/usr/bin/chromium-browser'];
          const executablePath = candidates.find(fs.existsSync);
          if (!executablePath) throw new Error('No Chrome/Chromium executable found');

          const url = 'https://pickleball-queue-5zu9fyqw4-meow-7e9e.vercel.app/';

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const context = await browser.newContext({
              ...devices['Pixel 5'],
              locale: 'en-US',
              colorScheme: 'dark'
            });
            const page = await context.newPage();

            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));

            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 20000 });
            await page.waitForTimeout(3000);

            const manifest = await page.evaluate(async () => {
              const href = document.querySelector('link[rel="manifest"]')?.href || null;
              if (!href) return { href, status: null, body: null };
              const r = await fetch(href);
              return { href, status: r.status, body: await r.json() };
            });

            const registration = await page.evaluate(async () => {
              const reg = await navigator.serviceWorker.ready;
              return { active: reg.active?.state || null, controller: !!navigator.serviceWorker.controller };
            });

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 20000 });
            await page.waitForTimeout(1500);

            const controlled = await page.evaluate(() => ({
              controller: !!navigator.serviceWorker.controller,
              scriptURL: navigator.serviceWorker.controller?.scriptURL || null
            }));

            const cdp = await context.newCDPSession(page);
            let installability = null;
            let appManifest = null;
            try { installability = await cdp.send('Page.getInstallabilityErrors'); } catch (e) { installability = { unavailable: String(e) }; }
            try { appManifest = await cdp.send('Page.getAppManifest'); } catch (e) { appManifest = { unavailable: String(e) }; }

            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'domcontentloaded', timeout: 20000 });
            await page.locator('#pn').fill('Alice, Bob, Carol, Dan');
            await page.locator('#f button').click();
            await page.waitForTimeout(300);

            await context.setOffline(true);
            await page.reload({ waitUntil: 'domcontentloaded', timeout: 15000 });
            await page.waitForTimeout(1000);

            const offlineLoaded = (await page.locator('body').innerText()).includes('The Stack');
            await page.locator('#pn').fill('Eve, Frank, Gina, Hank');
            await page.locator('#f button').click();
            await page.waitForTimeout(300);
            await page.locator('#go').click();
            await page.waitForTimeout(500);
            const courtsText = await page.locator('#courts').innerText();

            const out = {
              executablePath,
              manifest,
              registration,
              controlled,
              installability,
              appManifest,
              offlineLoaded,
              offlineMatchStarted: courtsText.includes('Eve') && courtsText.includes('Frank') && /LIVE/.test(courtsText),
              consoleErrors,
              pageErrors
            };
            console.log(JSON.stringify(out, null, 2));

            if (manifest.status !== 200) throw new Error('Manifest status was not 200');
            if (manifest.body?.name !== 'PickleStack') throw new Error('Manifest name mismatch');
            if (registration.active !== 'activated') throw new Error('Service worker did not activate');
            if (!controlled.controller) throw new Error('Service worker did not control after reload');
            if (!offlineLoaded) throw new Error('Offline shell did not load');
            if (!out.offlineMatchStarted) throw new Error('Offline add/start match failed');
            if (consoleErrors.length || pageErrors.length) throw new Error('Console/page errors detected');

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
