name: Release 5 verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [release5-menu]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify patch from clean main
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show HEAD:index.html > /tmp/expected-index.html
          git show HEAD:sw.js > /tmp/expected-sw.js
          git checkout origin/main -- index.html sw.js
          python3 release5_menu.py --dry-run
          python3 release5_menu.py
          cmp /tmp/expected-index.html index.html
          cmp /tmp/expected-sw.js sw.js
      - name: Check patched inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path("index.html").read_text(encoding="utf-8")
          assert h.count("function initMenu()") == 1
          assert 'button[title="Players"]' in h
          assert 'id="mnb"' in h
          assert 'id="qmenu"' in h
          assert h.count('onclick="live()"') == 1
          start = h.find("<script>\nconst K=")
          end = h.find("</script>", start)
          if start < 0 or end < 0:
            raise SystemExit("main inline script not found")
          Path("/tmp/queuezerotwo-inline.js").write_text(h[start+8:end], encoding="utf-8")
          PY
          node --check /tmp/queuezerotwo-inline.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:css
      - name: Run Release 2 Playwright smoke
        env:
          APP_URL: http://127.0.0.1:4173/
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          nohup python3 -m http.server 4173 >/tmp/queuezerotwo-http.log 2>&1 &
          node tests/release2b-sessions.mjs
