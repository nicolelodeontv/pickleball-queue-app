name: Release 6 verification
on:
  push:
    branches: [release6-sidebar]
    paths:
      - release6_sidebar.py
      - tests/release2b-sessions.mjs
      - package.json
      - package-lock.json
      - .github/workflows/tmp-release6-verify.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release6-sidebar
      - run: test -z "$(git status --porcelain)"
      - run: python3 release6_sidebar.py --dry-run
      - run: python3 release6_sidebar.py
      - name: Check Release 6 output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path("index.html").read_text(encoding="utf-8")
          w=Path("sw.js").read_text(encoding="utf-8")
          assert h.count("function initMenu(){")==1
          assert "qscrim" in h and "qmenu" in h
          assert "id='mnb'" in h and "id='qmenu'" in h
          assert "setTimeout(initMenu,0)" not in h
          assert "queuezerotwo-v10" in w
          start=h.find("<script>\nconst K=")
          end=h.find("</script>",start)
          assert start>=0 and end>start
          Path("/tmp/qzt-inline.js").write_text(h[start+8:end],encoding="utf-8")
          PY
          node --check /tmp/qzt-inline.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - name: Run Release 2 Playwright smoke
        env:
          APP_URL: http://127.0.0.1:4173/
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          nohup python3 -m http.server 4173 >/tmp/qzt-http.log 2>&1 &
          node tests/release2b-sessions.mjs
      - name: Commit applied Release 6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js tailwind.css
          git diff --cached --quiet || git commit -m "Release 6: move menu to responsive sidebar"
          git push origin HEAD:release6-sidebar
