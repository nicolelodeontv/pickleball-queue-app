name: Release 6 verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Release 6 patch against clean main
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show HEAD:index.html > /tmp/expected-index.html
          git show HEAD:sw.js > /tmp/expected-sw.js
          git checkout origin/main -- index.html sw.js
          python3 release6_sidebar.py --dry-run
          python3 release6_sidebar.py
          cmp /tmp/expected-index.html index.html
          cmp /tmp/expected-sw.js sw.js
          git checkout HEAD -- index.html sw.js
      - name: Check restored Release 6 output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path("index.html").read_text(encoding="utf-8")
          w=Path("sw.js").read_text(encoding="utf-8")
          assert h.count("function initMenu(){")==1
          assert "qscrim" in h and "qmenu" in h and "id='mnb'" in h
          assert "setTimeout(initMenu,0)" not in h
          assert "queuezerotwo-v10" in w
          start=h.find("<script>\nconst K=")
          end=h.find("</script>",start)
          assert start>=0 and end>start
          Path("/tmp/qzt-inline.js").write_text(h[start+8:end],encoding="utf-8")
          PY
          node --check /tmp/qzt-inline.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - name: Run Release 2 Playwright smoke
        env:
          APP_URL: http://127.0.0.1:4173/
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          nohup python3 -m http.server 4173 >/tmp/qzt-http.log 2>&1 &
          node tests/release2b-sessions.mjs
